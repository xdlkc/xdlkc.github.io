<svg width="1400" height="780" viewBox="0 0 1400 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="780" rx="28" fill="#F8FAFC"/>
  <text x="84" y="88" fill="#0F172A" font-size="42" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">内循环质量与外循环自动化的复利分化</text>
  <text x="84" y="132" fill="#475569" font-size="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">自动化不会凭空产生秩序，它只会按指数倍率放大内循环的工程底色。</text>

  <!-- Left Card: Low-trust loop -->
  <rect x="84" y="176" width="584" height="536" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="120" y="232" fill="#9A3412" font-size="30" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">低信任循环：未锁死内环就放大外环</text>

  <rect x="120" y="264" width="512" height="84" rx="18" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
  <text x="376" y="298" text-anchor="middle" fill="#7C2D12" font-size="22" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">单步内循环干净率 ≈ 80%</text>
  <text x="376" y="328" text-anchor="middle" fill="#9A3412" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">靠 AGENTS.md 提醒与人工抽查勉强兜底</text>

  <path d="M376 348V376" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
  <path d="M364 370L376 386L388 370" stroke="#F97316" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="120" y="388" width="512" height="84" rx="18" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
  <text x="376" y="422" text-anchor="middle" fill="#7C2D12" font-size="22" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">连续 10 轮无人干预叠加</text>
  <text x="376" y="452" text-anchor="middle" fill="#B91C1C" font-size="18" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">0.8^10 ≈ 10.7% 整体健康率</text>

  <path d="M376 472V500" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
  <path d="M364 494L376 510L388 494" stroke="#F97316" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="120" y="512" width="512" height="84" rx="18" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
  <text x="376" y="546" text-anchor="middle" fill="#7C2D12" font-size="22" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">坏模式传染全库，人工 Review 死锁</text>
  <text x="376" y="576" text-anchor="middle" fill="#9A3412" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">临时补丁与免责注释被后续 Agent 隐式复制</text>

  <text x="120" y="644" fill="#9A3412" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">• 规则文档越写越厚，注意力稀释后依然反复破窗</text>
  <text x="120" y="678" fill="#9A3412" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">• 外循环并发越多，返工与修补的 Token 账单越失控</text>

  <!-- Right Card: High-trust loop -->
  <rect x="732" y="176" width="584" height="536" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="768" y="232" fill="#1D4ED8" font-size="30" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">高信任循环：先硬化内环，再自治外环</text>

  <rect x="768" y="264" width="512" height="84" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="1024" y="298" text-anchor="middle" fill="#1E3A8A" font-size="22" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">架构边界 + 零逃生舱 Lint</text>
  <text x="1024" y="328" text-anchor="middle" fill="#1D4ED8" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">100% 确定性门禁，让默认产出即符合工程规范</text>

  <path d="M1024 348V376" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <path d="M1012 370L1024 386L1036 370" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="768" y="388" width="512" height="84" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="1024" y="422" text-anchor="middle" fill="#1E3A8A" font-size="22" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">四重自动化验证证据链</text>
  <text x="1024" y="452" text-anchor="middle" fill="#1D4ED8" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CDP + Bombadil + TLA+ + Lean</text>

  <path d="M1024 472V500" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <path d="M1012 494L1024 510L1036 494" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="768" y="512" width="512" height="84" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="1024" y="546" text-anchor="middle" fill="#1E3A8A" font-size="22" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">发版触发云端 Agent 外环自治</text>
  <text x="1024" y="576" text-anchor="middle" fill="#1D4ED8" font-size="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">全量模糊测试 → 自动提修补 PR → 过门禁合入</text>

  <text x="768" y="644" fill="#1E3A8A" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">• 单月 11,000 PR 并发下回滚率维持约 0.47%</text>
  <text x="768" y="678" fill="#1E3A8A" font-size="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">• 人类审查重心转到状态图、录屏与产品方向</text>
</svg>
