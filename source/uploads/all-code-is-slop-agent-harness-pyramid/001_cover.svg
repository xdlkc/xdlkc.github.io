  <text x="160" y="428" fill="#334155" font-size="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">当单月合入 11,000 个 PR 时，靠自然语言叮嘱无法守住工程底线；</text>
