  <text x="1100" y="176" fill="#0F172A" font-size="24" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">“All Code Is Slop</text>
  <text x="1116" y="210" fill="#0F172A" font-size="24" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">(Except Mine)”</text>
  <text x="1116" y="246" fill="#475569" font-size="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">— Lauren Tan (@poteto)</text>

