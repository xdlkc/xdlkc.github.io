<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="cbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="#0f172a" rx="12"/>
  <text x="30" y="30" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">TOP CONTRIBUTORS</text>
  <!-- Peter Steinberger -->
  <text x="30" y="65" fill="#94a3b8" font-family="monospace" font-size="10">Peter Steinberger</text>
  <rect x="180" y="52" width="450" height="18" fill="url(#cbar)" rx="3" opacity="0.9">
    <animate attributeName="width" from="0" to="450" dur="1s" fill="freeze"/>
  </rect>
  <text x="640" y="66" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">19,284 (62%)</text>
  <!-- Vincent Koc -->
  <text x="30" y="95" fill="#94a3b8" font-family="monospace" font-size="10">Vincent Koc</text>
  <rect x="180" y="82" width="95" height="18" fill="#3b82f6" rx="3" opacity="0.7">
    <animate attributeName="width" from="0" to="95" dur="1.2s" fill="freeze"/>
  </rect>
  <text x="285" y="96" fill="#64748b" font-family="monospace" font-size="10">4,067</text>
  <!-- Tak Hoffman -->
  <text x="30" y="125" fill="#94a3b8" font-family="monospace" font-size="10">Tak Hoffman</text>
  <rect x="180" y="112" width="26" height="18" fill="#8b5cf6" rx="3" opacity="0.7">
    <animate attributeName="width" from="0" to="26" dur="1.4s" fill="freeze"/>
  </rect>
  <text x="215" y="126" fill="#64748b" font-family="monospace" font-size="10">1,122</text>
  <!-- Others -->
  <text x="30" y="155" fill="#64748b" font-family="monospace" font-size="10">Others (60+ contributors)</text>
  <rect x="180" y="142" width="45" height="18" fill="#475569" rx="3" opacity="0.5">
    <animate attributeName="width" from="0" to="45" dur="1.6s" fill="freeze"/>
  </rect>
  <text x="235" y="156" fill="#64748b" font-family="monospace" font-size="10">6,510</text>
  <!-- Annotation -->
  <text x="400" y="185" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="10" opacity="0.7">一个人写了 62% 的代码 ≈ 平均每天 130 次提交</text>
</svg>
