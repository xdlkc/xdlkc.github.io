<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" fill="#0f172a" rx="12"/>
  <text x="30" y="30" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">COMMITS / MONTH</text>
  <text x="650" y="30" fill="#f97316" font-family="monospace" font-size="12" font-weight="bold">30,983 total</text>
  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="60" y1="50" x2="780" y2="50"/>
    <line x1="60" y1="90" x2="780" y2="90"/>
    <line x1="60" y1="130" x2="780" y2="130"/>
    <line x1="60" y1="170" x2="780" y2="170"/>
  </g>
  <!-- Bars -->
  <rect x="90" y="60" width="100" height="130" fill="url(#bar)" rx="4" opacity="0.7">
    <animate attributeName="height" from="0" to="130" dur="0.8s" fill="freeze"/>
    <animate attributeName="y" from="190" to="60" dur="0.8s" fill="freeze"/>
  </rect>
  <text x="140" y="55" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">~4,200</text>
  <rect x="230" y="50" width="100" height="140" fill="url(#bar)" rx="4" opacity="0.8">
    <animate attributeName="height" from="0" to="140" dur="1s" fill="freeze"/>
    <animate attributeName="y" from="190" to="50" dur="1s" fill="freeze"/>
  </rect>
  <text x="280" y="45" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">~6,800</text>
  <rect x="370" y="55" width="100" height="135" fill="url(#bar)" rx="4" opacity="0.85">
    <animate attributeName="height" from="0" to="135" dur="1.2s" fill="freeze"/>
    <animate attributeName="y" from="190" to="55" dur="1.2s" fill="freeze"/>
  </rect>
  <text x="420" y="50" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">~6,500</text>
  <rect x="510" y="52" width="100" height="138" fill="url(#bar)" rx="4" opacity="0.9">
    <animate attributeName="height" from="0" to="138" dur="1.4s" fill="freeze"/>
    <animate attributeName="y" from="190" to="52" dur="1.4s" fill="freeze"/>
  </rect>
  <text x="560" y="47" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">~6,700</text>
  <rect x="650" y="65" width="100" height="125" fill="url(#bar)" rx="4" opacity="1.0">
    <animate attributeName="height" from="0" to="125" dur="1.6s" fill="freeze"/>
    <animate attributeName="y" from="190" to="65" dur="1.6s" fill="freeze"/>
  </rect>
  <text x="700" y="60" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">~6,400*</text>
  <!-- Month labels -->
  <text x="140" y="205" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Dec '25</text>
  <text x="280" y="205" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Jan '26</text>
  <text x="420" y="205" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Feb '26</text>
  <text x="560" y="205" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Mar '26</text>
  <text x="700" y="205" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="10">Apr '26 *</text>
</svg>
