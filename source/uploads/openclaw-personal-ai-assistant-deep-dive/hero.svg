<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)" rx="16"/>
  <!-- Gateway hub -->
  <circle cx="400" cy="200" r="60" fill="none" stroke="url(#accent)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="400" cy="200" r="45" fill="#f97316" opacity="0.15"/>
  <text x="400" y="195" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="14" font-weight="bold">GATEWAY</text>
  <text x="400" y="215" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">ws://127.0.0.1:18789</text>
  <!-- Channel nodes -->
  <g>
    <!-- Top row -->
    <circle cx="160" cy="80" r="22" fill="#1e40af" opacity="0.8"/><text x="160" y="85" text-anchor="middle" fill="white" font-size="10">Telegram</text>
    <circle cx="320" cy="60" r="22" fill="#1d4ed8" opacity="0.8"/><text x="320" y="65" text-anchor="middle" fill="white" font-size="10">WhatsApp</text>
    <circle cx="480" cy="60" r="22" fill="#4f46e5" opacity="0.8"/><text x="480" y="65" text-anchor="middle" fill="white" font-size="10">Discord</text>
    <circle cx="640" cy="80" r="22" fill="#7c3aed" opacity="0.8"/><text x="640" y="85" text-anchor="middle" fill="white" font-size="10">Slack</text>
    <!-- Bottom row -->
    <circle cx="160" cy="320" r="22" fill="#059669" opacity="0.8"/><text x="160" y="325" text-anchor="middle" fill="white" font-size="10">微信</text>
    <circle cx="320" cy="340" r="22" fill="#0d9488" opacity="0.8"/><text x="320" y="345" text-anchor="middle" fill="white" font-size="10">飞书</text>
    <circle cx="480" cy="340" r="22" fill="#0891b2" opacity="0.8"/><text x="480" y="345" text-anchor="middle" fill="white" font-size="10">Signal</text>
    <circle cx="640" cy="320" r="22" fill="#0284c7" opacity="0.8"/><text x="640" y="325" text-anchor="middle" fill="white" font-size="10">iMessage</text>
    <!-- Side nodes -->
    <circle cx="80" cy="200" r="22" fill="#dc2626" opacity="0.8"/><text x="80" y="205" text-anchor="middle" fill="white" font-size="9">IRC</text>
    <circle cx="720" cy="200" r="22" fill="#ea580c" opacity="0.8"/><text x="720" y="195" text-anchor="middle" fill="white" font-size="8">Matrix</text>
    <text x="720" y="208" text-anchor="middle" fill="white" font-size="7">Teams</text>
  </g>
  <!-- Connection lines with animation -->
  <g stroke="#f97316" stroke-width="1" opacity="0.4">
    <line x1="182" y1="80" x2="345" y2="180"/>
    <line x1="320" y1="82" x2="370" y2="170"/>
    <line x1="480" y1="82" x2="430" y2="170"/>
    <line x1="618" y1="80" x2="455" y2="180"/>
    <line x1="182" y1="320" x2="345" y2="220"/>
    <line x1="320" y1="318" x2="370" y2="230"/>
    <line x1="480" y1="318" x2="430" y2="230"/>
    <line x1="618" y1="320" x2="455" y2="220"/>
    <line x1="102" y1="200" x2="340" y2="200"/>
    <line x1="698" y1="200" x2="460" y2="200"/>
  </g>
  <!-- Stats overlay -->
  <text x="400" y="30" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="20" font-weight="bold" filter="url(#glow)">🦞 OpenClaw</text>
  <text x="400" y="390" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">22 channels · 105 plugins · 128万行代码 · 30000+ commits</text>
</svg>
