<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="180" y1="80" x2="1410" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.45" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFDF8"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="185" cy="170" r="130" fill="#F97316" fill-opacity="0.12"/>
  <circle cx="1420" cy="760" r="180" fill="#2563EB" fill-opacity="0.10"/>
  <circle cx="1260" cy="160" r="96" fill="#0F172A" fill-opacity="0.06"/>

  <g filter="url(#shadow)">
    <rect x="104" y="92" width="1392" height="716" rx="34" fill="url(#card)"/>
  </g>

  <text x="160" y="196" fill="#0F172A" font-size="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2">LLM WIKI</text>
  <text x="160" y="274" fill="#0F172A" font-size="74" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">从检索信息</text>
  <text x="160" y="360" fill="#0F172A" font-size="74" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">到编译知识</text>
  <text x="160" y="428" fill="#334155" font-size="28" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Karpathy 的核心判断不是“多一个笔记系统”，而是</text>
  <text x="160" y="468" fill="#334155" font-size="28" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">在原始材料与问答之间，插入一层持续演化的知识编译层。</text>

  <g>
    <rect x="160" y="560" width="280" height="150" rx="24" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <text x="192" y="612" fill="#9A3412" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">raw/</text>
    <text x="192" y="654" fill="#7C2D12" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">论文、文章、笔记</text>
    <text x="192" y="687" fill="#7C2D12" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">不可变事实材料</text>
  </g>

  <g>
    <rect x="520" y="560" width="320" height="150" rx="24" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="554" y="614" fill="#0F172A" font-size="28" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">持续维护的 Wiki</text>
    <text x="554" y="654" fill="#334155" font-size="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">实体页 / 概念页 / 对比页</text>
    <text x="554" y="686" fill="#334155" font-size="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">冲突标记 / 综合结论 / 引用</text>
  </g>

  <g>
    <rect x="920" y="560" width="320" height="150" rx="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="954" y="612" fill="#1D4ED8" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">query/analysis</text>
    <text x="954" y="654" fill="#1E3A8A" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">问答、报告、洞见</text>
    <text x="954" y="686" fill="#1E3A8A" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">继续回写成知识资产</text>
  </g>

  <path d="M440 635H488" stroke="#F97316" stroke-width="8" stroke-linecap="round"/>
  <path d="M484 619L517 635L484 651" stroke="#F97316" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M840 635H888" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
  <path d="M884 619L917 635L884 651" stroke="#2563EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="1030" y="170" fill="#0F172A" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">“Obsidian is the IDE;</text>
  <text x="1030" y="200" fill="#0F172A" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">the LLM is the programmer;</text>
  <text x="1030" y="230" fill="#0F172A" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">the wiki is the codebase.”</text>
</svg>
