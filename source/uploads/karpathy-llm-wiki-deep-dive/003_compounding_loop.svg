  <text x="101" y="788" fill="#475569" font-size="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">关键变化：聊天记录里的瞬时答案，开始变成一个可被下次继续利用、继续修正的知识资产。</text>
