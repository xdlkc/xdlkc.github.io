<svg width="1400" height="860" viewBox="0 0 1400 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="860" rx="28" fill="#FFFDF8"/>
  <text x="92" y="98" fill="#0F172A" font-size="46" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">LLM Wiki 的“知识复利”闭环</text>
  <text x="92" y="142" fill="#475569" font-size="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">它不是静态仓库，而是一个会被持续编译、回写和校正的活系统。</text>

  <circle cx="700" cy="446" r="164" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="626" y="434" fill="#0F172A" font-size="30" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Wiki</text>
  <text x="552" y="476" fill="#334155" font-size="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">持续演化的知识中间层</text>

  <rect x="584" y="162" width="232" height="116" rx="26" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="630" y="218" fill="#9A3412" font-size="28" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">1. 摄入新资料</text>
  <text x="620" y="253" fill="#7C2D12" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">论文、文章、会议记录</text>

  <rect x="962" y="360" width="252" height="116" rx="26" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="1010" y="416" fill="#1D4ED8" font-size="28" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">2. 结构化综合</text>
  <text x="1000" y="451" fill="#1E3A8A" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">实体页 / 主题页 / 冲突</text>

  <rect x="584" y="614" width="252" height="116" rx="26" fill="#ECFDF5" stroke="#86EFAC" stroke-width="2"/>
  <text x="632" y="670" fill="#166534" font-size="28" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">3. 生成新输出</text>
  <text x="620" y="705" fill="#166534" font-size="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">问答、报告、对比、洞见</text>

