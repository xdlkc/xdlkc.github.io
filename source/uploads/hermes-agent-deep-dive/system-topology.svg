<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172554"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3F1D2E"/>
      <stop offset="1" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#052E2B"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="cardD" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3B0764"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1680" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="90" y="130" width="320" height="260" rx="28" fill="url(#cardA)" stroke="#93C5FD" stroke-opacity="0.45"/>
    <rect x="450" y="130" width="320" height="260" rx="28" fill="url(#cardB)" stroke="#FDBA74" stroke-opacity="0.45"/>
    <rect x="810" y="130" width="320" height="260" rx="28" fill="url(#cardC)" stroke="#5EEAD4" stroke-opacity="0.45"/>
    <rect x="1170" y="130" width="320" height="260" rx="28" fill="url(#cardD)" stroke="#C4B5FD" stroke-opacity="0.45"/>

    <rect x="90" y="470" width="1400" height="250" rx="30" fill="#0F172A" stroke="#334155"/>
  </g>

  <text x="90" y="78" fill="#F8FAFC" font-size="42" font-family="Helvetica, Arial, sans-serif" font-weight="700">Hermes Agent 的四层系统拓扑</text>
  <text x="90" y="110" fill="#94A3B8" font-size="24" font-family="Helvetica, Arial, sans-serif">不是单个 agent，而是一套让 agent 长期运转的底盘</text>

  <text x="120" y="185" fill="#DBEAFE" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">对话心脏</text>
  <text x="120" y="228" fill="#E2E8F0" font-size="22" font-family="Helvetica, Arial, sans-serif">AIAgent</text>
  <text x="120" y="264" fill="#BFDBFE" font-size="20" font-family="Helvetica, Arial, sans-serif">run_conversation</text>
  <text x="120" y="300" fill="#BFDBFE" font-size="20" font-family="Helvetica, Arial, sans-serif">provider routing</text>
  <text x="120" y="336" fill="#BFDBFE" font-size="20" font-family="Helvetica, Arial, sans-serif">prompt caching</text>

  <text x="480" y="185" fill="#FFEDD5" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">工具装配</text>
  <text x="480" y="228" fill="#E2E8F0" font-size="22" font-family="Helvetica, Arial, sans-serif">registry.register</text>
  <text x="480" y="264" fill="#FED7AA" font-size="20" font-family="Helvetica, Arial, sans-serif">toolsets</text>
  <text x="480" y="300" fill="#FED7AA" font-size="20" font-family="Helvetica, Arial, sans-serif">dynamic schemas</text>
  <text x="480" y="336" fill="#FED7AA" font-size="20" font-family="Helvetica, Arial, sans-serif">availability checks</text>

  <text x="840" y="185" fill="#CCFBF1" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">交互表面</text>
  <text x="840" y="228" fill="#E2E8F0" font-size="22" font-family="Helvetica, Arial, sans-serif">CLI</text>
  <text x="840" y="264" fill="#99F6E4" font-size="20" font-family="Helvetica, Arial, sans-serif">Gateway</text>
  <text x="840" y="300" fill="#99F6E4" font-size="20" font-family="Helvetica, Arial, sans-serif">ACP Adapter</text>
  <text x="840" y="336" fill="#99F6E4" font-size="20" font-family="Helvetica, Arial, sans-serif">Slash Commands</text>

  <text x="1200" y="185" fill="#E9D5FF" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">长期状态</text>
  <text x="1200" y="228" fill="#E2E8F0" font-size="22" font-family="Helvetica, Arial, sans-serif">SessionDB</text>
  <text x="1200" y="264" fill="#DDD6FE" font-size="20" font-family="Helvetica, Arial, sans-serif">memory + skills</text>
  <text x="1200" y="300" fill="#DDD6FE" font-size="20" font-family="Helvetica, Arial, sans-serif">profiles</text>
  <text x="1200" y="336" fill="#DDD6FE" font-size="20" font-family="Helvetica, Arial, sans-serif">session search</text>

  <path d="M410 260H450" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M770 260H810" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M1130 260H1170" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>

  <text x="120" y="525" fill="#F8FAFC" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700">为什么这四层会让 Hermes 更像一个活系统</text>
  <text x="120" y="575" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">1. 不同平台共用同一套 agent runtime，而不是各写各的 bot</text>
  <text x="120" y="615" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">2. 工具不是硬编码暴露，而是按场景、平台、环境动态装配</text>
  <text x="120" y="655" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">3. 会话、记忆、profile 和命令系统都围绕长期协作设计</text>
  <text x="120" y="695" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">4. 很多约束直接来自真实运行条件，比如 prompt caching、WAL 写锁、平台接入</text>
</svg>
