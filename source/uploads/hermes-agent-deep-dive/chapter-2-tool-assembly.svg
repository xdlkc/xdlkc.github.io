<svg width="1600" height="860" viewBox="0 0 1600 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="860" rx="40" fill="#101826"/>
  <text x="90" y="86" fill="#F8FAFC" font-size="42" font-family="Helvetica, Arial, sans-serif" font-weight="700">第二章，Hermes 的工具不是堆出来的，而是装配出来的</text>
  <text x="90" y="124" fill="#FDBA74" font-size="24" font-family="Helvetica, Arial, sans-serif">register at import time，再由 model_tools 和 toolsets 按场景筛选出本轮真正可见的能力面</text>
  <rect x="120" y="220" width="300" height="150" rx="28" fill="#1F2937" stroke="#475569"/>
  <rect x="510" y="220" width="300" height="150" rx="28" fill="#3F1D2E" stroke="#F59E0B"/>
  <rect x="900" y="220" width="300" height="150" rx="28" fill="#172554" stroke="#60A5FA"/>
  <rect x="1290" y="220" width="190" height="150" rx="28" fill="#052E2B" stroke="#34D399"/>
  <text x="168" y="284" fill="#E5E7EB" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700">tools/*.py</text>
  <text x="150" y="324" fill="#94A3B8" font-size="22" font-family="Helvetica, Arial, sans-serif">每个模块自注册 schema、handler、check_fn</text>
  <text x="560" y="284" fill="#FEF3C7" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700">ToolRegistry</text>
  <text x="552" y="324" fill="#FCD34D" font-size="22" font-family="Helvetica, Arial, sans-serif">统一收口 dispatch 和 definitions</text>
  <text x="942" y="284" fill="#DBEAFE" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700">toolsets.py</text>
  <text x="944" y="324" fill="#93C5FD" font-size="22" font-family="Helvetica, Arial, sans-serif">按平台、风险和场景组合能力</text>
  <text x="1330" y="284" fill="#D1FAE5" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700">模型</text>
  <text x="1316" y="324" fill="#86EFAC" font-size="22" font-family="Helvetica, Arial, sans-serif">只看到这一轮能用的工具</text>
  <path d="M420 295H510" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M810 295H900" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M1200 295H1290" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <rect x="120" y="470" width="1360" height="230" rx="28" fill="#0F172A" stroke="#334155"/>
  <text x="160" y="530" fill="#F8FAFC" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">为什么这套装配结构值钱</text>
  <text x="160" y="580" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">1. 新增工具时改动路径固定，不会一处注册三处补丁。</text>
  <text x="160" y="620" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">2. check_fn 和 toolset 过滤把「有没有权限」「环境是否满足」变成了运行时判断。</text>
  <text x="160" y="660" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">3. 真正暴露给模型的是动态能力面，而不是一个写死的、越长越乱的 schema 大杂烩。</text>
</svg>
