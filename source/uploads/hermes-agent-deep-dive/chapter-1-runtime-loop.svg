<svg width="1600" height="860" viewBox="0 0 1600 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c1bg" x1="0" y1="0" x2="1600" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#13233C"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="860" rx="40" fill="url(#c1bg)"/>
  <text x="90" y="86" fill="#F8FAFC" font-size="42" font-family="Helvetica, Arial, sans-serif" font-weight="700">第一章，对话循环不是抽象概念，而是一条真正在跑的 runtime 链路</text>
  <text x="90" y="124" fill="#93C5FD" font-size="24" font-family="Helvetica, Arial, sans-serif">AIAgent 在一轮对话里要同时处理消息、提示词、工具、状态持久化和异常恢复</text>
  <rect x="120" y="220" width="220" height="110" rx="24" fill="#172554" stroke="#60A5FA"/>
  <rect x="400" y="220" width="260" height="110" rx="24" fill="#1E3A8A" stroke="#93C5FD"/>
  <rect x="720" y="220" width="260" height="110" rx="24" fill="#0F766E" stroke="#5EEAD4"/>
  <rect x="1040" y="220" width="220" height="110" rx="24" fill="#7C2D12" stroke="#FDBA74"/>
  <rect x="1320" y="220" width="160" height="110" rx="24" fill="#4C1D95" stroke="#C4B5FD"/>
  <text x="180" y="285" fill="#E0F2FE" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700">用户消息</text>
  <text x="448" y="273" fill="#EFF6FF" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700">缓存 system prompt</text>
  <text x="458" y="307" fill="#BFDBFE" font-size="22" font-family="Helvetica, Arial, sans-serif">sanitize + retry reset</text>
  <text x="782" y="273" fill="#F0FDFA" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700">模型调用</text>
  <text x="762" y="307" fill="#99F6E4" font-size="22" font-family="Helvetica, Arial, sans-serif">text 或 tool_calls</text>
  <text x="1088" y="285" fill="#FFF7ED" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700">工具派发</text>
  <text x="1364" y="285" fill="#F5F3FF" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700">落库</text>
  <path d="M340 275H400" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M660 275H720" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M980 275H1040" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M1260 275H1320" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M1150 360C1150 430 910 430 910 360" stroke="#F59E0B" stroke-width="5" stroke-dasharray="12 10"/>
  <text x="890" y="458" fill="#FCD34D" font-size="24" font-family="Helvetica, Arial, sans-serif">有工具调用时回环，把结果重新喂回模型</text>
  <rect x="120" y="560" width="1360" height="180" rx="28" fill="#0F172A" stroke="#334155"/>
  <text x="160" y="620" fill="#F8FAFC" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">这一章真正要表达的，不是 loop 本身，而是 loop 外面那层现实世界的脏活</text>
  <text x="160" y="668" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">stale connection 清理、fallback runtime、compression warning、todo hydration、session continuation，这些都在告诉你 Hermes 不是论文里的 agent，而是被真实环境打磨过的运行时。</text>
</svg>
