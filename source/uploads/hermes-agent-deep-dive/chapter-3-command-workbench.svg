<svg width="1600" height="860" viewBox="0 0 1600 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="860" rx="40" fill="#0F172A"/>
  <text x="90" y="86" fill="#F8FAFC" font-size="42" font-family="Helvetica, Arial, sans-serif" font-weight="700">第三章，CLI 不是壳子，而是一个工作台</text>
  <text x="90" y="124" fill="#6EE7B7" font-size="24" font-family="Helvetica, Arial, sans-serif">同一份 Command Registry，长出 help、autocomplete、Telegram menu、Slack routing 和 gateway dispatch</text>
  <rect x="120" y="190" width="520" height="520" rx="30" fill="#111827" stroke="#334155"/>
  <text x="160" y="248" fill="#F8FAFC" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700">用户面对的是两层界面</text>
  <text x="160" y="316" fill="#A7F3D0" font-size="26" font-family="Helvetica, Arial, sans-serif" font-weight="700">聊天层</text>
  <text x="160" y="356" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">像在和 AI 对话，提问、追问、看结果</text>
  <text x="160" y="430" fill="#93C5FD" font-size="26" font-family="Helvetica, Arial, sans-serif" font-weight="700">调度层</text>
  <text x="160" y="470" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">/model /reasoning /tools /skills /browser /snapshot</text>
  <text x="160" y="510" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">不是一次调用，而是在操作整个 runtime</text>
  <rect x="740" y="220" width="220" height="90" rx="22" fill="#1D4ED8" fill-opacity="0.18" stroke="#60A5FA"/>
  <rect x="1000" y="220" width="220" height="90" rx="22" fill="#047857" fill-opacity="0.18" stroke="#34D399"/>
  <rect x="1260" y="220" width="220" height="90" rx="22" fill="#7C3AED" fill-opacity="0.18" stroke="#A78BFA"/>
  <text x="800" y="274" fill="#DBEAFE" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">CLI</text>
  <text x="1040" y="274" fill="#D1FAE5" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">Gateway</text>
  <text x="1304" y="274" fill="#E9D5FF" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">Bots</text>
  <rect x="820" y="390" width="580" height="180" rx="28" fill="#1E293B" stroke="#475569"/>
  <text x="864" y="454" fill="#F8FAFC" font-size="30" font-family="Helvetica, Arial, sans-serif" font-weight="700">COMMAND_REGISTRY</text>
  <text x="864" y="498" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">单一真相源，避免文档、菜单、派发和 alias 各自漂移</text>
  <path d="M850 390V312" stroke="#60A5FA" stroke-width="5"/>
  <path d="M1110 390V312" stroke="#34D399" stroke-width="5"/>
  <path d="M1370 390V312" stroke="#A78BFA" stroke-width="5"/>
</svg>
