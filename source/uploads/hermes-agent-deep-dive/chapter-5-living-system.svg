  <text x="240" y="258" fill="#DBEAFE" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">Telegram</text>
  <text x="236" y="618" fill="#FEF3C7" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">CLI</text>
  <text x="1276" y="258" fill="#D1FAE5" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">Slack</text>
  <text x="1260" y="618" fill="#E9D5FF" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">Discord</text>
  <path d="M400 247C560 280 630 322 700 372" stroke="#60A5FA" stroke-width="5"/>
  <path d="M400 607C560 560 630 518 700 468" stroke="#F59E0B" stroke-width="5"/>
  <path d="M1200 247C1040 280 970 322 900 372" stroke="#34D399" stroke-width="5"/>
  <path d="M1200 607C1040 560 970 518 900 468" stroke="#A78BFA" stroke-width="5"/>
  <rect x="480" y="700" width="640" height="90" rx="22" fill="#0F172A" stroke="#334155"/>
  <text x="530" y="757" fill="#CBD5E1" font-size="22" font-family="Helvetica, Arial, sans-serif">真正让人格长出来的不是一句 system prompt，而是连续的入口、连续的状态、连续的协作关系。</text>
