<svg width="1600" height="860" viewBox="0 0 1600 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="860" rx="40" fill="#0B1220"/>
  <text x="90" y="86" fill="#F8FAFC" font-size="42" font-family="Helvetica, Arial, sans-serif" font-weight="700">第五章，Hermes 更像活物，是因为它在组织一种持续存在</text>
  <text x="90" y="124" fill="#5EEAD4" font-size="24" font-family="Helvetica, Arial, sans-serif">不同入口遇到同一个 agent，同一套状态继续生长，这种连续性才会慢慢长出人格</text>
  <circle cx="800" cy="420" r="124" fill="#083344" stroke="#5EEAD4" stroke-width="3"/>
  <text x="738" y="410" fill="#ECFEFF" font-size="38" font-family="Helvetica, Arial, sans-serif" font-weight="700">同一个</text>
  <text x="704" y="456" fill="#ECFEFF" font-size="38" font-family="Helvetica, Arial, sans-serif" font-weight="700">Hermes</text>
  <rect x="180" y="200" width="220" height="94" rx="24" fill="#172554" stroke="#60A5FA"/>
  <rect x="180" y="560" width="220" height="94" rx="24" fill="#3F1D2E" stroke="#F59E0B"/>
