<svg width="1600" height="860" viewBox="0 0 1600 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1600" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <filter id="soft" x="-50" y="-50" width="1700" height="960" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1600" height="860" rx="36" fill="url(#bg2)"/>
  <text x="90" y="78" fill="#F9FAFB" font-size="40" font-family="Helvetica, Arial, sans-serif" font-weight="700">Hermes 的命令表面，不只是 CLI 壳子</text>
  <text x="90" y="112" fill="#9CA3AF" font-size="24" font-family="Helvetica, Arial, sans-serif">一个中心 Command Registry，同时喂给 CLI、Gateway、Telegram、Slack 和自动补全</text>

  <g filter="url(#soft)">
    <rect x="120" y="180" width="290" height="510" rx="28" fill="#0F172A" stroke="#334155"/>
    <rect x="455" y="180" width="290" height="510" rx="28" fill="#111827" stroke="#334155"/>
    <rect x="790" y="180" width="290" height="510" rx="28" fill="#0F172A" stroke="#334155"/>
    <rect x="1125" y="180" width="290" height="510" rx="28" fill="#111827" stroke="#334155"/>
  </g>

  <text x="155" y="235" fill="#C7D2FE" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">Session</text>
  <text x="155" y="280" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">/new  /clear  /retry</text>
  <text x="155" y="320" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">/undo  /branch</text>
  <text x="155" y="360" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">/compress  /snapshot</text>
  <text x="155" y="400" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">/background  /queue</text>
  <text x="155" y="440" fill="#94A3B8" font-size="20" font-family="Helvetica, Arial, sans-serif">用户在调度一个长期运行的会话</text>

  <text x="490" y="235" fill="#FCA5A5" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">Configuration</text>
  <text x="490" y="280" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">/model  /provider</text>
  <text x="490" y="320" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">/reasoning  /fast</text>
  <text x="490" y="360" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">/skin  /voice</text>
  <text x="490" y="400" fill="#94A3B8" font-size="20" font-family="Helvetica, Arial, sans-serif">不是一次调用，而是 runtime 的调参面板</text>

  <text x="825" y="235" fill="#6EE7B7" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">Tools and Skills</text>
  <text x="825" y="280" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">/tools  /toolsets</text>
  <text x="825" y="320" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">/skills  /cron</text>
  <text x="825" y="360" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">/browser  /reload-mcp</text>
  <text x="825" y="400" fill="#94A3B8" font-size="20" font-family="Helvetica, Arial, sans-serif">能力面是动态装配出来的</text>

  <text x="1160" y="235" fill="#FDE68A" font-size="28" font-family="Helvetica, Arial, sans-serif" font-weight="700">Derived Surfaces</text>
  <text x="1160" y="280" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">CLI help</text>
  <text x="1160" y="320" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">Gateway help</text>
  <text x="1160" y="360" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">Telegram menu</text>
  <text x="1160" y="400" fill="#E5E7EB" font-size="22" font-family="Helvetica, Arial, sans-serif">Slack routing</text>
  <text x="1160" y="440" fill="#94A3B8" font-size="20" font-family="Helvetica, Arial, sans-serif">同一个注册表，长出所有表面</text>

  <path d="M410 300H455" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <path d="M745 300H790" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <path d="M1080 300H1125" stroke="#475569" stroke-width="5" stroke-linecap="round"/>

  <rect x="170" y="560" width="1260" height="90" rx="22" fill="#1E293B" stroke="#475569"/>
  <text x="220" y="615" fill="#F8FAFC" font-size="26" font-family="Helvetica, Arial, sans-serif">Command Registry 不是帮助文档，它其实就是 Hermes 的交互协议层</text>
</svg>
