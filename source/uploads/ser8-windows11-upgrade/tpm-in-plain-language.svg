<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1020" viewBox="0 0 720 1020" role="img" aria-labelledby="title desc"><title id="title">让系统找到“小保险箱”</title><desc id="desc">TPM是安全能力的简化比喻。设备列表有名称并不说明系统已经可用；本次切换设置后Windows识别到AMD TPM2.0。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53675f"/></marker></defs><rect x="0" y="0" width="720" height="1020" rx="25" fill="#f5f2eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="44" y="54" font-size="19" fill="#53675f" font-weight="400">CODEX × 我 · 一次真实协作</text><text x="44" y="117" font-size="38" fill="#193f3c" font-weight="700">让系统找到“小保险箱”</text><text x="44" y="165" font-size="27" fill="#53675f" font-weight="400">TPM：先把它理解成保管密钥的地方。</text><rect x="70" y="215" width="240" height="150" rx="15" fill="#193f3c"/><rect x="82" y="227" width="216" height="112" rx="7" fill="#ffffff"/><path d="M190 365 v21 M145 386 h90" stroke="#193f3c" stroke-width="9" stroke-linecap="round"/><text x="98" y="277" font-size="30" fill="#193f3c" font-weight="400">Windows</text><rect x="438" y="202" width="205" height="186" rx="20" fill="#193f3c"/><rect x="454" y="218" width="173" height="151" rx="20" fill="#e3eadd"/><circle cx="540" cy="283" r="35" fill="#ffffff" stroke="#193f3c" stroke-width="5"/><path d="M540 258v50 M515 283h50" stroke="#193f3c" stroke-width="5"/><text x="78" y="435" font-size="27" fill="#193f3c" font-weight="400">系统要能用它</text><text x="438" y="435" font-size="27" fill="#193f3c" font-weight="400">“小保险箱”</text><rect x="44" y="485" width="632" height="180" rx="20" fill="#ffffff"/><text x="72" y="532" font-size="26" fill="#53675f" font-weight="400">当时的困惑</text><text x="72" y="582" font-size="30" fill="#193f3c" font-weight="400">电脑里能看到名字，</text><text x="72" y="628" font-size="30" fill="#193f3c" font-weight="400">系统检查却说：还用不上。</text><path d="M360 687 L360 733" stroke="#53675f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="755" width="632" height="178" rx="20" fill="#193f3c"/><text x="72" y="803" font-size="26" fill="#e3eadd" font-weight="400">这次怎么解决</text><text x="72" y="852" font-size="27" fill="#ffffff" font-weight="400">助手核对原因 → 我按步骤改设置</text><text x="72" y="896" font-size="27" fill="#ffffff" font-weight="400">重启复查 → Windows 终于认出来</text><text x="44" y="990" font-size="20" fill="#53675f" font-weight="400">过程示意 · 不是产品界面或操作截图</text></g></svg>