<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1020" viewBox="0 0 720 1020" role="img" aria-labelledby="title desc"><title id="title">把最初的要求，逐项核对回来</title><desc id="desc">升级后确认Windows11专业版已激活、TPM正常、安装结束，并抽查工作目录和常用程序；未逐项测试全部软件功能。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53675f"/></marker></defs><rect x="0" y="0" width="720" height="1020" rx="25" fill="#f5f2eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="44" y="54" font-size="19" fill="#53675f" font-weight="400">CODEX × 我 · 一次真实协作</text><text x="44" y="117" font-size="38" fill="#193f3c" font-weight="700">把最初的要求，逐项核对回来</text><rect x="44" y="160" width="632" height="650" rx="20" fill="#ffffff"/><text x="77" y="214" font-size="32" fill="#193f3c" font-weight="700">这次的验收单</text><circle cx="96" cy="274" r="23" fill="#193f3c"/><path d="M86 274 l7 8 l14 -17" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="282" font-size="29" fill="#193f3c" font-weight="700">新系统确实装好了</text><text x="140" y="324" font-size="25" fill="#53675f" font-weight="400">Windows 11 专业版</text><circle cx="96" cy="390" r="23" fill="#193f3c"/><path d="M86 390 l7 8 l14 -17" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="398" font-size="29" fill="#193f3c" font-weight="700">系统已经激活</text><text x="140" y="440" font-size="25" fill="#53675f" font-weight="400">查实际状态，不只看桌面变了</text><circle cx="96" cy="506" r="23" fill="#193f3c"/><path d="M86 506 l7 8 l14 -17" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="514" font-size="29" fill="#193f3c" font-weight="700">关键功能正常</text><text x="140" y="556" font-size="25" fill="#53675f" font-weight="400">TPM 已就绪，安装流程已结束</text><circle cx="96" cy="622" r="23" fill="#193f3c"/><path d="M86 622 l7 8 l14 -17" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="630" font-size="29" fill="#193f3c" font-weight="700">原来的东西还在</text><text x="140" y="672" font-size="25" fill="#53675f" font-weight="400">抽查了工作目录和常用程序</text><rect x="70" y="726" width="580" height="58" rx="20" fill="#e3eadd"/><text x="93" y="765" font-size="24" fill="#193f3c" font-weight="400">验收要回答最初的需求：保留工作环境。</text><text x="44" y="867" font-size="29" fill="#193f3c" font-weight="700">还需要我来做：</text><text x="44" y="913" font-size="26" fill="#53675f" font-weight="400">在日常使用中，继续确认软件功能。</text><text x="44" y="955" font-size="26" fill="#53675f" font-weight="400">文件存在，不代表所有功能都测过。</text><text x="44" y="990" font-size="20" fill="#53675f" font-weight="400">过程示意 · 不是产品界面或操作截图</text></g></svg>