<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1010" viewBox="0 0 720 1010" role="img" aria-labelledby="title desc"><title id="title">聊天断线，任务也能接着做</title><desc id="desc">升级电脑进入BIOS无法继续聊天时，使用另一台电脑与agent核对照片和交接单；返回Windows后继续复查。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53675f"/></marker></defs><rect x="0" y="0" width="720" height="1010" rx="25" fill="#f5f2eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="44" y="54" font-size="19" fill="#53675f" font-weight="400">CODEX × 我 · 一次真实协作</text><text x="44" y="117" font-size="38" fill="#193f3c" font-weight="700">聊天断线，任务也能接着做</text><rect x="44" y="167" width="292" height="192" rx="15" fill="#193f3c"/><rect x="56" y="179" width="268" height="154" rx="7" fill="#ffffff"/><path d="M190 359 v21 M145 380 h90" stroke="#193f3c" stroke-width="9" stroke-linecap="round"/><text x="72" y="229" font-size="30" fill="#193f3c" font-weight="400">升级中的电脑</text><rect x="384" y="167" width="292" height="192" rx="15" fill="#193f3c"/><rect x="396" y="179" width="268" height="154" rx="7" fill="#ffffff"/><path d="M530 359 v21 M485 380 h90" stroke="#193f3c" stroke-width="9" stroke-linecap="round"/><text x="412" y="229" font-size="30" fill="#193f3c" font-weight="400">另一台电脑</text><text x="65" y="267" font-size="26" fill="#53675f" font-weight="400">进入 BIOS</text><text x="65" y="310" font-size="26" fill="#53675f" font-weight="400">暂时不能聊天</text><text x="407" y="267" font-size="26" fill="#53675f" font-weight="400">保留聊天</text><text x="407" y="310" font-size="26" fill="#53675f" font-weight="400">对照现场照片</text><path d="M194 412 L194 461" stroke="#53675f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M530 412 L530 461" stroke="#53675f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="489" width="632" height="260" rx="20" fill="#ffffff"/><text x="74" y="539" font-size="32" fill="#193f3c" font-weight="700">中间靠一张“交接单”</text><text x="74" y="591" font-size="26" fill="#53675f" font-weight="400">这是什么机器？</text><text x="74" y="639" font-size="26" fill="#53675f" font-weight="400">哪些操作已经做过？</text><text x="74" y="687" font-size="26" fill="#53675f" font-weight="400">现在卡在哪里，下一步核对什么？</text><path d="M360 768 L360 814" stroke="#53675f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="837" width="632" height="98" rx="20" fill="#193f3c"/><text x="76" y="880" font-size="30" fill="#ffffff" font-weight="700">回到 Windows</text><text x="76" y="917" font-size="24" fill="#e3eadd" font-weight="400">把新结果交回原来的 Codex 继续检查</text><text x="44" y="980" font-size="20" fill="#53675f" font-weight="400">过程示意 · 不是产品界面或操作截图</text></g></svg>