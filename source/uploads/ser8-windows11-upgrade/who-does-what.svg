<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">它做准备，我做必要的操作</title><desc id="desc">本次实际分工：Codex读取状态核对资料、准备和校验更新盘，用户确认影响后重启操作BIOS，再由Codex复查。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53675f"/></marker></defs><rect x="0" y="0" width="720" height="1080" rx="25" fill="#f5f2eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="44" y="54" font-size="19" fill="#53675f" font-weight="400">CODEX × 我 · 一次真实协作</text><text x="44" y="117" font-size="38" fill="#193f3c" font-weight="700">它做准备，我做必要的操作</text><rect x="44" y="166" width="632" height="177" rx="20" fill="#e3eadd"/><text x="68" y="214" font-size="28" fill="#53675f" font-weight="700">01</text><text x="125" y="214" font-size="31" fill="#193f3c" font-weight="700">先看清楚</text><text x="70" y="265" font-size="25" fill="#193f3c" font-weight="400">Codex：查配置、看检测结果</text><text x="70" y="308" font-size="25" fill="#193f3c" font-weight="400">我：说明要保留什么</text><rect x="44" y="365" width="632" height="177" rx="20" fill="#ffffff"/><text x="68" y="413" font-size="28" fill="#53675f" font-weight="700">02</text><text x="125" y="413" font-size="31" fill="#193f3c" font-weight="700">把东西备好</text><text x="70" y="464" font-size="25" fill="#193f3c" font-weight="400">Codex：找官方文件、准备并校验</text><text x="70" y="507" font-size="25" fill="#193f3c" font-weight="400">我：确认哪只 U 盘可以清空</text><rect x="44" y="564" width="632" height="177" rx="20" fill="#e5ac80"/><text x="68" y="612" font-size="28" fill="#53675f" font-weight="700">03</text><text x="125" y="612" font-size="31" fill="#193f3c" font-weight="700">完成现场操作</text><text x="70" y="663" font-size="25" fill="#193f3c" font-weight="400">我：重启，进入底层设置界面</text><text x="70" y="706" font-size="25" fill="#193f3c" font-weight="400">助手：提供完整步骤和交接记录</text><rect x="44" y="763" width="632" height="177" rx="20" fill="#ffffff"/><text x="68" y="811" font-size="28" fill="#53675f" font-weight="700">04</text><text x="125" y="811" font-size="31" fill="#193f3c" font-weight="700">回到系统，再检查</text><text x="70" y="862" font-size="25" fill="#193f3c" font-weight="400">Codex：核对新结果与安装状态</text><text x="70" y="905" font-size="25" fill="#193f3c" font-weight="400">我：实际试用原来的工作环境</text><text x="44" y="1050" font-size="20" fill="#53675f" font-weight="400">过程示意 · 不是产品界面或操作截图</text></g></svg>