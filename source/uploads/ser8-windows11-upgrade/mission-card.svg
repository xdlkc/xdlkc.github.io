<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img" aria-labelledby="title desc"><title id="title">先说愿望，再拆成任务</title><desc id="desc">用户要求升级Windows11并保留文件和软件；助手把任务拆为检查、准备、协作操作与核验。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53675f"/></marker></defs><rect x="0" y="0" width="720" height="930" rx="25" fill="#f5f2eb"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="44" y="54" font-size="19" fill="#53675f" font-weight="400">CODEX × 我 · 一次真实协作</text><text x="44" y="117" font-size="38" fill="#193f3c" font-weight="700">先说愿望，再拆成任务</text><rect x="44" y="156" width="632" height="175" rx="20" fill="#193f3c"/><text x="72" y="204" font-size="23" fill="#e3eadd" font-weight="400">我的一句话</text><text x="72" y="253" font-size="33" fill="#ffffff" font-weight="400">“帮我升级电脑，</text><text x="72" y="301" font-size="33" fill="#ffffff" font-weight="400">文件和软件都要留着。”</text><path d="M360 350 L360 396" stroke="#53675f" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="44" y="420" width="632" height="400" rx="20" fill="#ffffff"/><text x="72" y="470" font-size="32" fill="#193f3c" font-weight="700">Codex 帮我拆成四步</text><circle cx="88" cy="521" r="23" fill="#193f3c"/><path d="M78 521 l7 8 l14 -17" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="530" font-size="27" fill="#193f3c" font-weight="400">先查：电脑卡在哪里？</text><circle cx="88" cy="597" r="23" fill="#193f3c"/><path d="M78 597 l7 8 l14 -17" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="606" font-size="27" fill="#193f3c" font-weight="400">准备：找资料、备好工具</text><circle cx="88" cy="673" r="23" fill="#193f3c"/><path d="M78 673 l7 8 l14 -17" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="682" font-size="27" fill="#193f3c" font-weight="400">配合：我完成必要的现场操作</text><circle cx="88" cy="749" r="23" fill="#193f3c"/><path d="M78 749 l7 8 l14 -17" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="758" font-size="27" fill="#193f3c" font-weight="400">验收：重新检查真实结果</text><text x="44" y="900" font-size="20" fill="#53675f" font-weight="400">过程示意 · 不是产品界面或操作截图</text></g></svg>