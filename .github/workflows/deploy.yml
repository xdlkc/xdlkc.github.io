name: Deploy Hexo

on:
  push:
    branches:
      - main
      - master
  workflow_run:
    workflows: ["Sync AIHOT News"]
    types: [completed]
  workflow_dispatch:
    inputs:
      post:
        description: "Optional post path to generate audio for (e.g. source/_posts/my-post.md)"
        required: false
        type: string
      force_audio:
        description: "Force regenerate script and MP3 for the specified post"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate audio for new posts
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(audio):') }}
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_POST: ${{ inputs.post }}
          INPUT_FORCE: ${{ inputs.force_audio }}
        run: |
          if [ -n "$INPUT_POST" ]; then
            python3 tools/auto_generate_audio.py
          else
            python3 tools/auto_generate_audio.py --best-effort
          fi

      - name: Commit and push generated audio
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(audio):') }}
        run: |
          if [ -n "$(git status --porcelain source/_posts source/uploads)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source/_posts source/uploads
            git commit -m "chore(audio): auto-generate post narration [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npx hexo generate

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
