title: Evan Zhang
subtitle: Agent Application Engineer
description: Personal blog about agent engineering, software architecture, and technical notes.
keywords:
  - blog
  - tech
  - agent
author: Evan Zhang
language: zh-CN
timezone: Asia/Shanghai

url: https://xdlkc.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults: {}

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: []

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date

theme: evan

comments:
  enable: true
  provider: utterances
  utterances:
    repo: xdlkc/xdlkc.github.io
    issue_term: pathname
    label: comment
    loading: lazy
    theme:
      light: github-light
      dark: github-dark

news:
  home_limit: 5

feed:
  type: rss2
  path: rss.xml
  limit: 20
  # Include full post content in RSS (better for readers)
  content: true

deploy: {}
